[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeef"
dynamic = ["version"]
description = "A simple desktop app to merge PDFs and extract pages - fast, offline, no uploads."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pydeef contributors" }]
keywords = ["pdf", "merge", "extract", "split", "pypdf", "tkinter", "gui", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf[crypto]>=5.0",
    "tkinterdnd2>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/agent-pjb/pydeef"
Issues = "https://github.com/agent-pjb/pydeef/issues"
Changelog = "https://github.com/agent-pjb/pydeef/blob/main/CHANGELOG.md"

# `pydeef` opens the window without a console on Windows.
[project.gui-scripts]
pydeef = "pydeef.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pydeef.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydeef = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
